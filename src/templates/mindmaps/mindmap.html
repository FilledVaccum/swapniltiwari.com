<section class="mindmap-category">
    <h2>New Mindmap</h2>
    <div class="mindmaps-grid">
        <div class="mindmap-card">
            <div class="mindmap-image">
                <img src="/src/assets/images/mindmaps/exported/your-mindmap-name.svg" 
                     alt="Your Mindmap Title"
                     loading="lazy"
                     onclick="expandMindmap(this)">
            </div>
            <div class="mindmap-content">
                <h3>Your Mindmap Title</h3>
                <p class="mindmap-description">
                    Brief description of what this mindmap covers.
                </p>
                <div class="mindmap-tags">
                    <span class="tech-tag">Tag1</span>
                    <span class="tech-tag">Tag2</span>
                </div>
            </div>
        </div>
    </div>
</section>

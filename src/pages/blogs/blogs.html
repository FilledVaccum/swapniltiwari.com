<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Swapnil Tiwari</title>
    <link rel="stylesheet" href="/src/assets/styles/style.css">
</head>
<body>
    <div id="header-container"></div>

    <main>
        <div class="blogs-container">
            <h1>Blogs</h1>
            <p class="blogs-intro">
                Every week, I document and articulate my acquired knowledge 
                and personal perspectives on topics that captivate my interest. 
                Here are all blogs I wrote to date.
            </p>

            <ul class="blog-list">
        <li>
            <span class="post-date">February 3, 2025:</span>
            <a href="/blogs/2025/02/lambda.html" class="post-link">Understanding AWS RDS</a>
            <p class="blog-description">A comprehensive guide to Amazon Relational Database Service</p>
            <div class="blog-tags">
                <span class="tech-tag">AWS</span><span class="tech-tag">Database</span><span class="tech-tag">RDS</span>
            </div>
        </li>
    </ul>
        </div>
    </main>
    
    <div id="footer-container"></div>

    <script>
        // Load components
        ['header', 'footer'].forEach(component => {
            fetch(`/src/components/${component}.html`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById(`${component}-container`).innerHTML = html;
                });
        });
    </script>
</body>
</html>
